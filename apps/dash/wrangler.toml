# Dash weekly board - dash.gershoncrm.com
# Before deploying: set `name` and the KV `id` to the ones the LIVE Worker uses
# (Cloudflare dashboard -> Workers & Pages -> the Worker on dash.gershoncrm.com
# -> Settings -> Bindings), so existing weeks (W35, W40, W42) are kept.
name = "dash-gershoncrm"
main = "src/worker.js"
compatibility_date = "2026-09-01"

routes = [{ pattern = "dash.gershoncrm.com/*", zone_name = "gershoncrm.com" }]

[[kv_namespaces]]
binding = "BOARD"
id = "REPLACE_WITH_LIVE_KV_NAMESPACE_ID"

# v1.2: NO cron here. The Monday schedule lives in the separate
# gershon-dash-cron Worker (apps/dash-cron/wrangler.toml, "15 12 * * 1"),
# which creates/refreshes the current ISO week's board in the same KV.
# (If a Cron Trigger "7 6 * * 1" was added to this Worker from PR #1,
# remove it in the dashboard so the board is not built twice.)

[observability]
enabled = true

# Secrets (set in the dashboard, never in this file):
# CLIENT_EMAIL, CLIENT_PASSWORD, SOCIAL_TOKEN, LINALYSIS_TOKEN, FINANCE_TOKEN, NEXASHARE_TOKEN
